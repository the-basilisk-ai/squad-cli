# Pin transitive versions (migrated from Yarn `resolutions`). As of pnpm 10.32
# the `pnpm` field in package.json is ignored, so overrides live here.
overrides:
  knip>picomatch: 4.0.4
  tinyglobby>picomatch: 4.0.4
  esbuild: 0.28.1
  js-yaml: ">=4.3.2 <5"
  smol-toml: ">=1.9.0 <2"
  browserslist: ">=4.28.7 <5"
  baseline-browser-mapping: ">=2.11.0 <3"
  postcss: ^8.5.23
  "@fastify/busboy": ">=3.2.1 <4"
  brace-expansion: ">=5.0.12 <6"
  shell-quote: ">=1.11.0 <2"
  source-map-js: ">=1.2.2 <2"
  "@graphql-tools/executor-legacy-ws": ">=1.1.35 <2"
  "@graphql-tools/wrap": ">=11.2.1 <12"
  "@graphql-codegen/schema-ast": ">=6.1.1 <7"

# Wait 7 days before resolving a newly published version, so a compromised
# fresh release can't be pulled in before it's caught. Matches the Dependabot
# cooldown in .github/dependabot.yml. Only affects resolving new versions;
# frozen-lockfile installs are unaffected.
minimumReleaseAge: 10080
# Reject transitive dependencies resolved from non-registry (git/tarball/etc.)
# sources, and block updates that would downgrade these security settings.
# Require pnpm >=10.26 / >=10.21 respectively — older pnpm silently ignores them.
blockExoticSubdeps: true
trustPolicy: no-downgrade
