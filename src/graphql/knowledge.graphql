query CliDocumentList($limit: Int, $offset: Int) {
  documentList(limit: $limit, offset: $offset) {
    id
    displayId
    title
    kind
    path
    tags
    updatedAt
    briefStatus
    briefType
  }
}

query CliBriefList($filters: BriefListFilters, $limit: Int, $offset: Int) {
  briefList(filters: $filters, limit: $limit, offset: $offset) {
    id
    displayId
    title
    briefStatus
    briefType
    decisionRecommendation
    updatedAt
    sourceInsight {
      id
      displayId
      title
    }
    sourceAction {
      id
      displayId
      title
    }
  }
}

mutation CliCreateDocument($input: CreateDocumentInput!) {
  createDocument(input: $input) {
    id
    displayId
    title
    path
  }
}

mutation CliUpdateDocument($id: String!, $input: UpdateDocumentInput!) {
  updateDocument(id: $id, input: $input) {
    id
    displayId
    title
    updatedAt
  }
}

mutation CliAddDocumentTag($id: String!, $tag: String!) {
  addDocumentTag(id: $id, tag: $tag) {
    id
    tags
  }
}

mutation CliRemoveDocumentTag($id: String!, $tag: String!) {
  removeDocumentTag(id: $id, tag: $tag) {
    id
    tags
  }
}

mutation CliGenerateBriefFromAction($actionId: String!, $type: BriefType) {
  generateBriefFromAction(actionId: $actionId, type: $type) {
    briefId
    briefDisplayId
  }
}

mutation CliGenerateBriefFromInsight($insightId: String!, $type: BriefType) {
  generateBriefFromInsight(insightId: $insightId, type: $type) {
    id
    displayId
    title
    briefStatus
  }
}

mutation CliRetryBriefGeneration($briefId: String!) {
  retryBriefGeneration(briefId: $briefId) {
    id
    displayId
    briefStatus
  }
}

mutation CliSetBriefStatus($briefId: String!, $status: BriefStatus!) {
  setBriefStatus(briefId: $briefId, status: $status) {
    id
    displayId
    title
    briefStatus
  }
}
